spring.application.name=politica-aberta

# A conexao vem de SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
# e SPRING_DATASOURCE_PASSWORD. Valores locais em .env.example.
# Sem essas variaveis, ou com o PostgreSQL indisponivel, a subida falha.

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

server.error.include-stacktrace=never
server.error.include-message=never
